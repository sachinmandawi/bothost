{% extends "base.html" %}

{% block title %}Sign In — BotHost{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="terminal-card">
    <div class="terminal-bar">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <h1>Authenticate</h1>
    <p class="sub">Access your BotHost deployment container.</p>

    <form method="POST" action="/login" class="stack-form">
      <label for="username">USERNAME</label>
      <input type="text" id="username" name="username" placeholder="enter username" required>

      <label for="password">PASSWORD</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn-primary">$ initialize session</button>
    </form>
    <p class="switch-link">No account? <a href="/signup">Create one</a></p>
  </div>
</div>
{% endblock %}
