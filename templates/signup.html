{% extends "base.html" %}

{% block title %}Sign up — BotHost{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="terminal-card">
    <div class="terminal-bar"><span></span><span></span><span></span></div>
    <h1>signup.sh</h1>
    <p class="sub">Get a free slot to host your bot</p>
    <form method="POST" action="/signup" class="stack-form">
      <label for="username">username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
        <button type="button" class="toggle-password" data-target="password" title="Toggle Password Visibility">👁️</button>
      </div>

      <label for="confirm">confirm password</label>
      <div class="password-wrap">
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="6">
        <button type="button" class="toggle-password" data-target="confirm" title="Toggle Password Visibility">👁️</button>
      </div>

      <button type="submit" class="btn-primary">$ create account</button>
    </form>
    <p class="switch-link">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
