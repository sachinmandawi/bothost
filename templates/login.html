{% extends "base.html" %}

{% block title %}Sign In — BotHost{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="terminal-card">
    <div class="terminal-bar">
      <span></span><span></span><span></span>
    </div>
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to access your 24/7 bot deployments</p>

    <form method="POST" action="/login" class="stack-form">
      <label for="username">USERNAME</label>
      <input type="text" id="username" name="username" placeholder="enter username" required autocomplete="username">

      <label for="password">PASSWORD</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
          👁️
        </button>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="switch-link">
      Don't have an account? <a href="/signup">Create one</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === "password") {
    input.type = "text";
    btn.innerHTML = "🔒";
  } else {
    input.type = "password";
    btn.innerHTML = "👁️";
  }
}
</script>
{% endblock %}
