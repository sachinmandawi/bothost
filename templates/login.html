{% extends "base.html" %}

{% block title %}Log in — BotHost{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="terminal-card">
    <div class="terminal-bar"><span></span><span></span><span></span></div>
    <h1>login.sh</h1>
    <p class="sub">Access your bot deployments</p>
    <form method="POST" action="/login" class="stack-form">
      <label for="username">username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="password" title="Toggle Password Visibility">👁️</button>
      </div>

      <button type="submit" class="btn-primary">$ login</button>
    </form>
    <p class="switch-link">No account? <a href="/signup">Create one</a></p>
  </div>
</div>
{% endblock %}
